[package]
name = "zim-search"
version = "0.1.0"
edition = "2021"
authors = ["Fredrik"]
description = "ZIM archive reader with vector and BM25 search"

[lib]
name = "zim_search"
path = "src/lib.rs"

[[bin]]
name = "zim-search"
path = "src/main.rs"

[features]
default = []
# Dense semantic vector support (ONNX inference via fastembed). Off by default:
# the default build is BM25/Tantivy lexical only, with no ONNX dependency and no model download.
semantic = ["dep:fastembed"]

[dependencies]
zim = "0.5.0"
fastembed = { version = "7.1.1", optional = true }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
indicatif = { version = "0.17", features = ["rayon"] }
nanohtml2text = "0.3.0"
tiny_http = "0.12"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2.1"
tantivy = "0.26.2"
memmap2 = "0.9"

[dev-dependencies]
tempfile = "3.27.0"
