[package]
name = "marmennill"
version = "1.0.0"
edition = "2024"
authors = ["Fredrik Andersson"]
license = "MIT"
rust-version = "1.98"
default-run = "marmel"

[[bin]]
name = "marmel"
path = "src/main.rs"

# Workspace root: this package (`marmennill`) stays the implicit default target for
# bare `cargo build/check/test/clippy` legs, so no `default-members` key is needed.
# The quoted rationale comes from the integration research notes in the OUTER marmel
# workspace `docs/` directory (i.e. `<marmel>/docs/`, outside this repository):
# `research_dependency_audit.md` §6 — "when unspecified, the root package will be
# used". The same layout is documented in this repo under `docs/kiwix_subcrate.md`.
# CI/gate legs are all bare, `-p`/`--workspace` greps zero hits.
# `crates/zim-search` is reached over MCP stdio only, so it is a member here but is
# deliberately NOT a path dependency of `marmennill` (no tantivy/zim in this graph).
# `semantic` (ONNX/fastembed) stays opt-in manual: CI runs `--all-features`
# (risk R1) and would force the libonnxruntime link.
[workspace]
resolver = "2"
members = ["crates/zim-search"]

[dependencies]
# Async runtime & Streams
tokio = { version = "1.54", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3.34"
futures-util = "0.3.34"
async-trait = "0.1.92"

# HTTP & Streaming
reqwest = { version = "0.13", features = ["json", "stream"] }
eventsource-stream = "0.2"

# Serialization & Config
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
toml = "1.1"

# Terminal & PTY
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
portable-pty = "0.9"
ansi-to-tui = "8.0"
ratatui-textarea = "0.9"
tui-markdown = "0.3"

# Text Processing, Tokenization & Search
tiktoken-rs = "0.12"
regex = "1.13"
ignore = "0.4"
unicode-width = "0.2"
unicode-segmentation = "1.13"

uuid = { version = "1.28", features = ["v4"] }

# System Diagnostics & Errors
dashmap = "6.2"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

# Windows sandbox backend (AppContainer). Pinned to 0.59 because that release
# links through the `windows-targets 0.52.6` static import library, which the
# `x86_64-pc-windows-gnu` cross-check leg can link; 0.61 switched to raw-dylib
# and is stricter. `Win32_Security_Isolation` is the feature carrying the
# AppContainer profile APIs (CreateAppContainerProfile/DeleteAppContainerProfile,
# linking userenv.dll); there is no `Win32_Security_AppContainer` feature.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Isolation",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Pipes"
] }

[dev-dependencies]
tempfile = "3.27"
wiremock = "0.6"

# Escalate target-specific unused/dead findings (only visible on some cfg branch)
# into hard errors for this package on every platform, without RUSTFLAGS leaking
# into path/registry dependencies. See docs/cross_platform_gating.md §B.
[lints.rust]
unused          = "deny"
dead_code       = "deny"
unused_imports  = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
