[package]
name = "marmennill"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
default-run = "marmel"

[[bin]]
name = "marmel"
path = "src/main.rs"

[dependencies]
# Async runtime & Streams
tokio = { version = "1.44", features = ["full"] }
futures = "0.3.31"
futures-util = "0.3.31"
async-trait = "0.1.86"

# HTTP & Streaming
reqwest = { version = "0.13", features = ["json", "stream"] }
eventsource-stream = "0.2"

# Serialization & Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"

# Terminal & PTY
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
portable-pty = "0.9"

# Text Processing, Tokenization & Search
tiktoken-rs = "0.12"
regex = "1.11"
ignore = "0.4"
unicode-width = "0.2"
unicode-segmentation = "1.12"

uuid = { version = "1.25", features = ["v4"] }

# System Diagnostics & Errors
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[dev-dependencies]
tempfile = "3.17"
wiremock = "0.6"
